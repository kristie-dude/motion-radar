name: snapshot
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Watch the leaderboard and save each update
        run: |
          git config user.name "motion-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          WATCH_MIN=330 python3 scripts/snap.py
      - name: Hand over to the next watcher
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run snapshot.yml --ref main
